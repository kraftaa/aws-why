[package]
name = "aws-why"
version = "0.1.0"
edition = "2024"
description = "Run AWS CLI commands and explain failures using the strongest available AWS evidence"
license = "MIT"

[dependencies]
clap = { version = "4.5.2", features = ["derive"] }
regex = "1.10.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"

[dev-dependencies]
tempfile = "3.10.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
