[package]
name = "aws-why"
version = "0.2.0"
edition = "2024"
description = "Explain AWS authorization failures and safely simulate IAM permissions"
license = "MIT"
repository = "https://github.com/kraftaa/aws-why"
homepage = "https://github.com/kraftaa/aws-why"
documentation = "https://github.com/kraftaa/aws-why#readme"

[dependencies]
clap = { version = "4.5.2", features = ["derive"] }
regex = "1.10.3"
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
tempfile = "3.10.1"
ureq = "3.4.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
